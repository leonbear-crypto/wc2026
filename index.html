    border-bottom: 1px solid rgba(211,170,60,.2);
    position: sticky; top: 0; z-index: 100;
  }
  header::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(211,170,60,.10) 0%, transparent 65%);
    pointer-events: none;
  }
  header h1 { font-size: 17px; color: #fff; margin-bottom: 2px; position: relative; z-index: 1; }
  header h1 span { color: #d3aa3c; }
  header p  { font-size: 11px; color: #4a6080; position: relative; z-index: 1; }

  .toolbar::-webkit-scrollbar { display: none; }
  .chip { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); border-radius: 20px; padding: 5px 12px; font-size: 12px; color: #4a6080; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  .chip.active { background: linear-gradient(135deg,#d3aa3c,#f0cc5a); border-color: transparent; color: #07112b; font-weight: 700; }
  #live-chip.has-live { border-color: rgba(248,81,73,.5); color: #f85149; }
  #live-chip.has-live::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#f85149; margin-right:4px; animation: pulse 1.5s infinite; }
  #live-chip.has-live.active { background: linear-gradient(135deg,#f85149,#ff8a80); color:#07112b; }
  #live-chip.has-live.active::before { background:#07112b; }

  .date-header { background: rgba(211,170,60,.07); padding: 8px 12px; font-size: 12px; font-weight: bold; color: #d3aa3c; border-left: 2px solid #d3aa3c; margin: 8px 10px 4px; border-radius: 0 6px 6px 0; }
  .date-header.knockout { border-left-color: #f0883e; color: #f0883e; background: rgba(240,136,62,.07); }

  .list { padding: 0 10px 100px; }

  .card { background: linear-gradient(145deg, #0d1e40 0%, #091530 100%); border: 1px solid rgba(255,255,255,.07); border-radius: 12px; padding: 12px 14px; margin-bottom: 6px; position: relative; overflow: hidden; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background: linear-gradient(90deg, transparent, rgba(211,170,60,.25), transparent); pointer-events:none; }
  .card.past  { opacity: 0.45; }
  .card.live  { border-color: rgba(248,81,73,.45); }
  .card.live::before { background: linear-gradient(90deg, transparent, rgba(248,81,73,.45), transparent); }
  .card.hidden { display: none; }

  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .teams { font-size: 15px; font-weight: bold; flex: 1; }

  .time-badge { text-align: right; flex-shrink: 0; }
  .time-big { font-size: 16px; font-weight: bold; color: #d3aa3c; font-family: monospace; }
  .date-small { font-size: 10px; color: #4a6080; }

  .score-box { text-align: center; padding: 4px 10px; border-radius: 6px; flex-shrink: 0; }
  .score-box.ft { background: rgba(211,170,60,.08); }
  .score-box.live-score { background: rgba(248,81,73,.12); animation: pulse 1.5s infinite; }
  .score-num { font-size: 18px; font-weight: bold; color: #fff; font-family: monospace; letter-spacing: 2px; }
  .score-label { font-size: 9px; color: #4a6080; margin-top: 1px; }
  .score-label.live-label { color: #f85149; font-weight: bold; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

  .card-bottom { display: flex; align-items: center; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
  .badge { border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: bold; }
  .badge.group   { background: rgba(211,170,60,.12); color: #d3aa3c; border: 1px solid rgba(211,170,60,.2); }
  .badge.ko      { background: rgba(240,136,62,.12); color: #f0883e; border: 1px solid rgba(240,136,62,.2); }
  .venue { font-size: 10px; color: #2e4a6a; }

  .group-table { margin: 4px 0 8px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.07); font-size: 11px; }
  .group-table table { width: 100%; border-collapse: collapse; }
  .group-table th { background: rgba(0,0,0,.3); padding: 5px 8px; color: #4a6080; text-align: left; font-weight: normal; }
  .group-table td { padding: 5px 8px; border-top: 1px solid rgba(255,255,255,.05); }
  .group-table tr.advance td { background: rgba(211,170,60,.05); }
  .group-table .rank { color: #4a6080; width: 16px; }
  .group-table .pts  { font-weight: bold; color: #d3aa3c; }
  .group-table .pending { color: #2e4a6a; font-style: italic; font-size: 10px; padding: 6px 8px; }
  .countdown { font-size: 11px; color: #d3aa3c; font-family: monospace; margin-left: auto; opacity: .8; }
  .countdown.soon { color: #f85149; font-weight: bold; opacity: 1; }
  .countdown.done { color: #2e4a6a; }

  .statusbar { position: fixed; bottom: 0; left: 0; right: 0; background: #07112b; border-top: 1px solid rgba(211,170,60,.15); padding: 10px 14px; display: flex; justify-content: space-between; font-size: 12px; color: #4a6080; }
  #clock { font-family: monospace; color: #d3aa3c; }
  #sync-status { font-size: 10px; color: #2e4a6a; }

  .refresh-btn { background: rgba(255,255,255,.06); border: 1px solid rgba(211,170,60,.25); border-radius: 6px; padding: 3px 8px; font-size: 10px; color: #d3aa3c; cursor: pointer; margin-left: 6px; }
  .refresh-btn:active { background: rgba(211,170,60,.15); }

  .card-detail { overflow:hidden; max-height:0; transition:max-height .3s cubic-bezier(.32,1,.23,1), padding .3s; padding:0 0; }
  .card-detail.open { max-height:240px; padding:10px 0 2px; }
  .rank-row { display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,.3); border-radius:8px; padding:10px 14px; }
  .rank-team { font-size:12px; font-weight:bold; max-width:80px; word-break:keep-all; }
  .rank-num { font-size:22px; font-weight:bold; color:#d3aa3c; font-family:monospace; }
  .rank-label { font-size:10px; color:#4a6080; text-align:center; }

  .card.expanded .chevron { transform: rotate(180deg); color:#d3aa3c; }
  .fav-star { font-size:14px; padding:2px 4px; cursor:pointer; opacity:.35; transition: opacity .15s, transform .15s; }
  .fav-star.active { opacity:1; }
  .fav-star:active { transform: scale(1.3); }
  #fav-chip.has-fav { border-color: rgba(211,170,60,.4); color:#d3aa3c; }

  .prob-hn { color:#d3aa3c; }
  .prob-dn { color:#2e4a6a; text-align:center; flex:1; }

// ─── 실시간 Elo (대회 결과로 업데이트, 초기값 = ELO 복사) ──
let currentElo = Object.assign({}, ELO);
const processedEloMatches = new Set(); // 이미 처리한 경기 ID
const ELO_K = 60; // FIFA WC K팩터 (eloratings.net 기준)

function updateEloFromResult(homeKor, awayKor, homeGoals, awayGoals, matchId) {
  if (processedEloMatches.has(matchId)) return;
  processedEloMatches.add(matchId);

  const ra = currentElo[homeKor] || 1600;
  const rb = currentElo[awayKor] || 1600;
  const expected = 1 / (1 + Math.pow(10, (rb - ra) / 600));
  const actual   = homeGoals > awayGoals ? 1 : homeGoals === awayGoals ? 0.5 : 0;
  const delta    = ELO_K * (actual - expected);

  currentElo[homeKor] = Math.round(ra + delta);
  currentElo[awayKor] = Math.round(rb - delta);
}

// ─── 확률 계산 (순수 Elo 100% — 실시간 업데이트 반영) ─────
function calcWinProb(homeKor, awayKor, isKnockout) {
  const eloA = currentElo[homeKor] || ELO[homeKor] || 1600;
  const eloB = currentElo[awayKor] || ELO[awayKor] || 1600;
  const pHome = 1 / (1 + Math.pow(10, (eloB - eloA) / 600));
  if (isKnockout) {
    const pH = Math.round(pHome * 100);
    return { home: pH, draw: 0, away: 100 - pH };
  }
  const diff  = Math.abs(eloA - eloB);
  const pDraw = Math.max(0.12, 0.30 - 0.0005 * diff);
  const pH = Math.round(pHome * (1 - pDraw) * 100);
  const pD = Math.round(pDraw * 100);
  const pA = 100 - pH - pD;
  return { home: pH, draw: pD, away: pA };
}

function parseKST(d, t) {
  const p = d.split("-"), q = t.split(":");
  return new Date(Date.UTC(+p[0], +p[1]-1, +p[2], +q[0]-9, +q[1]));
}

// ─── ESPN API 점수 가져오기 ───────────────────────────────
async function fetchScores(manual) {
  const now = new Date();
  // 대회 기간 아닐 때는 스킵 (6월 11일 ~ 7월 21일)
  const start = new Date('2026-06-11T00:00:00');
  const end   = new Date('2026-07-21T23:59:59');
  if (now < start || now > end) {
    setSyncStatus('대회 시작 전');
    return;
  }

  setSyncStatus('불러오는 중...');

  // 오늘 ± 2일 UTC 날짜 조회 (KST 새벽 경기는 UTC 전날이므로 여유분 포함)
  const dates = new Set();
  const range = manual ? 7 : 2;
  for (let offset = -range; offset <= 1; offset++) {
    const d = new Date(now);
    d.setUTCDate(d.getUTCDate() + offset);
    dates.add(d.toISOString().slice(0,10).replace(/-/g,''));
  }

  // 점수 없는 과거 경기는 항상 추가 조회
  // (ESPN scoreboard 날짜는 ET 기준이라 KST 새벽 경기가 전날로 분류될 수 있음)
  M.forEach(function(m) {
    if (!m.away || m.score) return;
    const dt = parseKST(m.d, m.t);
    if (dt >= now) return;
    const kstMidnight = new Date(m.d + 'T00:00:00+09:00');
    dates.add(kstMidnight.toISOString().slice(0,10).replace(/-/g,''));
    dates.add(new Date(kstMidnight.getTime() - 24*3600*1000).toISOString().slice(0,10).replace(/-/g,''));
    dates.add(new Date(kstMidnight.getTime() - 48*3600*1000).toISOString().slice(0,10).replace(/-/g,''));
  });

  let updated = 0;
  for (const dateStr of dates) {
    try {
      const url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=' + dateStr;
      const resp = await fetch(url);
      if (!resp.ok) continue;
      const data = await resp.json();
      if (!data.events) continue;

      data.events.forEach(function(event) {
        const comp = event.competitions[0];
        const competitors = comp.competitors;
        if (!competitors || competitors.length < 2) return;

        const home = competitors.find(function(c){ return c.homeAway === 'home'; }) || competitors[0];
        const away = competitors.find(function(c){ return c.homeAway === 'away'; }) || competitors[1];

        const homeKor = TEAM_MAP[home.team.displayName] || TEAM_MAP[home.team.name] || home.team.displayName;
        const awayKor = TEAM_MAP[away.team.displayName] || TEAM_MAP[away.team.name] || away.team.displayName;

        // ESPN event.date는 UTC → KST로 변환 후 날짜 비교
        const eventDateKST = event.date
          ? new Date(new Date(event.date).getTime() + 9*3600*1000).toISOString().slice(0,10).replace(/-/g,'')
          : dateStr;

        // 매칭: 같은 날짜(KST) + 두 팀 중 하나가 일치
        const homeKorClean = homeKor.replace('🇰🇷 ','');
        const awayKorClean = awayKor.replace('🇰🇷 ','');
        const match = M.find(function(m) {
          if (m.d.replace(/-/g,'') !== eventDateKST) return false;
          const mHome = m.home.replace('🇰🇷 ','');
          const mAway = m.away ? m.away.replace('🇰🇷 ','') : '';
          return (mHome === homeKorClean && mAway === awayKorClean) ||
                 (mHome === awayKorClean && mAway === homeKorClean);
        });
        if (!match) return;

        const status = comp.status;
        const state  = status.type.state;   // 'pre' | 'in' | 'post'
        const detail = status.type.shortDetail || '';

        if (!match.espnId) match.espnId = event.id; // 항상 ID 저장

        if (state === 'post' || state === 'in') {
          match.espnId = event.id; // 상세 조회용 ID 저장
          // 점수 순서 맞추기 (홈/어웨이 방향)
          const mHome = match.home.replace('🇰🇷 ','');
          let hs = home.score || '0', as = away.score || '0';
          if (mHome !== homeKorClean) { const tmp = hs; hs = as; as = tmp; } // 방향 반전
          match.score = hs + ' - ' + as;
          match.winner = null;
          if (state === 'post') {
            match.statusLabel = 'FT';
            // 승자 저장
            const homeWin = +hs > +as;
            const awayWin = +as > +hs;
            if (homeWin) match.winner = match.home;
            else if (awayWin) match.winner = match.away;
            else match.winner = null; // 무승부
            // 실시간 Elo 업데이트
            const hk2 = match.home.replace('🇰🇷 ','');
            const ak2 = match.away ? match.away.replace('🇰🇷 ','') : null;
            if (ak2) updateEloFromResult(hk2, ak2, +hs, +as, match.id);
          } else {
            match.statusLabel = detail || 'LIVE';
          }
          updated++;
        }
      });
    } catch(e) {
      console.warn('ESPN fetch error:', dateStr, e);
      setSyncStatus('⚠️ 연결 오류: ' + e.message);
    }
  }

  // 토너먼트 승자 → 다음 라운드 업데이트
  propagateWinners();

  // 새 결과 있을 때만 우승확률 캐시 무효화
  if (updated > 0) { winProbCache = null; }

  if (curFilter === 'WINPROB') {
    filterWinProb();
  } else {
    render();
  }
  const t = new Date();
  setSyncStatus('업데이트: ' + t.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
}

// 그룹 스테이지 결과 → 32강 슬롯 자동 채우기
function propagateWinners() {
  // 그룹별 포인트 집계
  const groups = {};
  ['A','B','C','D','E','F','G','H','I','J','K','L'].forEach(function(g) { groups[g] = {}; });

  M.forEach(function(m) {
    if (!m.g.startsWith('그룹')) return;
    if (!m.score) return;
    const grp = m.g.replace('그룹','');
    if (!groups[grp]) return;
    const [hs, as] = m.score.split(' - ').map(Number);
    const h = m.home.replace('🇰🇷 ','');
    const a = m.away.replace('🇰🇷 ','');
    if (!groups[grp][h]) groups[grp][h] = {pts:0, gd:0, gf:0};
    if (!groups[grp][a]) groups[grp][a] = {pts:0, gd:0, gf:0};
    if (hs > as) { groups[grp][h].pts += 3; }
    else if (hs < as) { groups[grp][a].pts += 3; }
    else { groups[grp][h].pts += 1; groups[grp][a].pts += 1; }
    groups[grp][h].gd += hs - as; groups[grp][h].gf += hs;
    groups[grp][a].gd += as - hs; groups[grp][a].gf += as;
  });

  // 조별 순위 계산
  const rank = {};
  Object.keys(groups).forEach(function(g) {
    const teams = Object.entries(groups[g]).sort(function(a,b){
      if (b[1].pts !== a[1].pts) return b[1].pts - a[1].pts;
      if (b[1].gd  !== a[1].gd)  return b[1].gd  - a[1].gd;
      return b[1].gf - a[1].gf;
    });
    rank[g] = teams.map(function(t){ return t[0]; });
  });

  // 32강 슬롯 텍스트 교체 (원래 값 보존용 fallback 포함)
  function setSlot(matchId, field, grp, pos) {
    const m = M.find(function(x){ return x.id === matchId; });
    if (!m) return;
    const teams = rank[grp];
    if (!teams || teams.length < pos) return;
    m[field] = teams[pos-1];
  }

  // id:73 A조2위 vs B조2위
  setSlot(73, 'home', 'A', 2); setSlot(73, 'away', 'B', 2);
  setSlot(74, 'home', 'E', 1);
  setSlot(75, 'home', 'F', 1); setSlot(75, 'away', 'C', 2);
  setSlot(76, 'home', 'C', 1); setSlot(76, 'away', 'F', 2);
  setSlot(78, 'home', 'E', 2); setSlot(78, 'away', 'I', 2);
  setSlot(79, 'home', 'A', 1);
  setSlot(80, 'home', 'L', 1);
  setSlot(81, 'home', 'D', 1);
  setSlot(82, 'home', 'G', 1);
  setSlot(83, 'home', 'K', 2); setSlot(83, 'away', 'L', 2);
  setSlot(84, 'home', 'H', 1); setSlot(84, 'away', 'J', 2);
  setSlot(85, 'home', 'B', 1);
  setSlot(86, 'home', 'J', 1); setSlot(86, 'away', 'H', 2);
  setSlot(87, 'home', 'K', 1);
  setSlot(88, 'home', 'D', 2); setSlot(88, 'away', 'G', 2);

  // 토너먼트 승자 전파 (32강 → 16강 → 8강 → 4강 → 결승)
  function applyWinner(srcId, field, destMatchId, destField) {
    const src = M.find(function(x){ return x.id === srcId; });
    const dst = M.find(function(x){ return x.id === destMatchId; });
    if (!src || !dst || !src.winner) return;
    dst[destField] = src.winner;
  }

  // 패자 전파 (3·4위전용)
  function applyLoser(srcId, destMatchId, destField) {
    const src = M.find(function(x){ return x.id === srcId; });
    const dst = M.find(function(x){ return x.id === destMatchId; });
    if (!src || !dst || !src.winner || !src.away) return;
    const loser = src.winner === src.home ? src.away : src.home;
    dst[destField] = loser;
  }

  // 16강
  applyWinner(74,'winner',89,'home'); applyWinner(77,'winner',89,'away');
  applyWinner(73,'winner',90,'home'); applyWinner(75,'winner',90,'away');
  applyWinner(76,'winner',91,'home'); applyWinner(78,'winner',91,'away');
  applyWinner(79,'winner',92,'home'); applyWinner(80,'winner',92,'away');
  applyWinner(83,'winner',93,'home'); applyWinner(84,'winner',93,'away');
  applyWinner(81,'winner',94,'home'); applyWinner(82,'winner',94,'away');
  applyWinner(86,'winner',95,'home'); applyWinner(88,'winner',95,'away');
  applyWinner(85,'winner',96,'home'); applyWinner(87,'winner',96,'away');
  // 8강
  applyWinner(89,'winner',97,'home'); applyWinner(90,'winner',97,'away');
  applyWinner(93,'winner',98,'home'); applyWinner(94,'winner',98,'away');
  applyWinner(91,'winner',99,'home'); applyWinner(92,'winner',99,'away');
  applyWinner(95,'winner',100,'home');applyWinner(96,'winner',100,'away');
  // 4강
  applyWinner(97,'winner',101,'home');applyWinner(98,'winner',101,'away');
  applyWinner(99,'winner',102,'home');applyWinner(100,'winner',102,'away');
  // 결승
  applyWinner(101,'winner',104,'home');applyWinner(102,'winner',104,'away');
  // 3·4위전 (4강 패자들)
  applyLoser(101,103,'home'); applyLoser(102,103,'away');
}

// ─── 조 순위표 ────────────────────────────────────────────
function buildGroupTable(grp) {
  const matches = M.filter(function(m){ return m.g === grp && m.score; });
  if (matches.length === 0) {
    return '<div class="group-table"><div class="pending">경기 결과 집계 중...</div></div>';
  }
  const teams = {};
  matches.forEach(function(m) {
    const h = m.home.replace('🇰🇷 ','');
    const a = m.away.replace('🇰🇷 ','');
    if (!teams[h]) teams[h] = {pts:0,w:0,d:0,l:0,gf:0,ga:0};
    if (!teams[a]) teams[a] = {pts:0,w:0,d:0,l:0,gf:0,ga:0};
    const parts = m.score.split(' - ');
    const hs = parseInt(parts[0]), as = parseInt(parts[1]);
    teams[h].gf+=hs; teams[h].ga+=as;
    teams[a].gf+=as; teams[a].ga+=hs;
    if (hs>as) { teams[h].pts+=3; teams[h].w++; teams[a].l++; }
    else if (hs<as) { teams[a].pts+=3; teams[a].w++; teams[h].l++; }
    else { teams[h].pts+=1; teams[a].pts+=1; teams[h].d++; teams[a].d++; }
  });
  const sorted = Object.entries(teams).sort(function(a,b){
    if (b[1].pts!==a[1].pts) return b[1].pts-a[1].pts;
    const gdA=a[1].gf-a[1].ga, gdB=b[1].gf-b[1].ga;
    if (gdB!==gdA) return gdB-gdA;
    return b[1].gf-a[1].gf;
  });
  let html = '<div class="group-table"><table><tr><th>#</th><th>팀</th><th>승</th><th>무</th><th>패</th><th>득실</th><th class="pts">점</th></tr>';
  sorted.forEach(function(e,i){
    const t=e[1], gd=t.gf-t.ga;
    const advance = i < 2 ? ' class="advance"' : '';
    html += '<tr'+advance+'><td class="rank">'+(i+1)+'</td><td>'+e[0]+'</td><td>'+t.w+'</td><td>'+t.d+'</td><td>'+t.l+'</td><td>'+(gd>=0?'+':'')+gd+'</td><td class="pts">'+t.pts+'</td></tr>';
  });
  html += '</table></div>';
  return html;
}

        (m.away ? '<span class="chevron">▼</span>' : '') +
      '</div>' +
      detailHtml;

    frag.appendChild(card);
    if (m.away) attachCardEvents(card, m);
  });

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.style.cssText = 'text-align:center;padding:40px;color:#8b949e;font-size:13px';
    empty.innerHTML = curFilter === 'live' ? '⚽ 현재 진행중인 경기가 없습니다'
      : curFilter === 'favorites' ? '⭐ 즐겨찾기한 팀이 없습니다<br>팀 이름 옆 ☆를 눌러 추가하세요'
      : '해당 경기 없음';
    frag.appendChild(empty);
  }

  container.innerHTML = '';
  container.appendChild(frag);

  // 펼침 상태 복원 (30초 자동갱신 시 사용자가 보던 카드 유지)
  if (expandedMatchId !== null) {
    var card = container.querySelector('.card[data-id="' + expandedMatchId + '"]');
    var detail = document.getElementById('detail-' + expandedMatchId);
    if (card && detail) {
      card.classList.add('expanded');
      detail.classList.add('open');
    } else {
      expandedMatchId = null;
    }
  }
}

function attachCardEvents(card, m) {
  card.addEventListener('click', function(){
    var detail = document.getElementById('detail-' + m.id);
    if (!detail) return;
    var isOpen = detail.classList.contains('open');
    document.querySelectorAll('.card-detail.open').forEach(function(d){ d.classList.remove('open'); });
    document.querySelectorAll('.card.expanded').forEach(function(c){ c.classList.remove('expanded'); });
    if (!isOpen) {
      detail.classList.add('open'); card.classList.add('expanded');
      expandedMatchId = m.id;
    } else {
      expandedMatchId = null;
    }
  });
}

function setSyncStatus(msg) {

  if (el) el.textContent = msg;
}

function tick() {
  const now = new Date();
  document.getElementById("clock").textContent = now.toLocaleTimeString("ko-KR");
  M.forEach(function(m) {
    const el = document.getElementById("cd-" + m.id);
    if (!el) return;
    const dt  = parseKST(m.d, m.t);
    const sec = (dt - now) / 1000;
    if (sec <= 0) {
      if (m.score && m.statusLabel === 'FT') {
        el.textContent = ""; el.className = "countdown done";
      } else if (m.statusLabel && m.statusLabel !== 'FT') {
        el.textContent = "🔴 " + m.statusLabel; el.className = "countdown soon";
      } else {
        // 시작 후 120분 이내 → 경기중 추정
        const minElapsed = (-sec) / 60;
        if (minElapsed < 120) {
          el.textContent = "🔴 경기중"; el.className = "countdown soon";
        } else {
          el.textContent = m.score ? "" : "종료"; el.className = "countdown done";
        }
      }
      return;
    }
    const d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600),
          mn = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
    const p = function(n){ return String(n).padStart(2,"0"); };
    el.textContent = d > 0 ? "D-"+d+" "+p(h)+":"+p(mn) : p(h)+":"+p(mn)+":"+p(s);
    el.className = "countdown" + (sec < 3600 ? " soon" : "");
  });
}

let winProbCache = null;

function compositeScore(team) {
  return (currentElo[team] || ELO[team] || 1600);
}

function buildGroupTeamsForSim() {
  const groups = {};
  M.forEach(function(m) {
    if (!m.away || KO.includes(m.g)) return;
    const grp = m.g;
    const h = m.home.replace('🇰🇷 ','');
    const a = m.away.replace('🇰🇷 ','');
    if (!groups[grp]) groups[grp] = [];
    if (!groups[grp].includes(h)) groups[grp].push(h);
    if (!groups[grp].includes(a)) groups[grp].push(a);
  });
  return groups;
}

function getKnownResult(home, away) {
  for (var i = 0; i < M.length; i++) {
    var m = M[i];
    if (!m.score || !m.away) continue;
    var h = m.home.replace('🇰🇷 ','');
    var a = m.away.replace('🇰🇷 ','');
    if (h === home && a === away) {
      var parts = m.score.split(' - ');
      var hs = parseInt(parts[0]), as = parseInt(parts[1]);
      return { hg: hs, ag: as };
    }
  }
  return null;
}

function simKOMatch(h, a) {
  var p = calcWinProb(h, a, true);
  return Math.random() * 100 < p.home ? h : a;
}

function simGroupStage(groupTeams) {
  var allThirds = [];
  var groupResult = {}; // {A:{first,second}, B:{...}, ...}

  Object.keys(groupTeams).forEach(function(grp) {
    var teams = groupTeams[grp];
    var pts = {}, gd = {}, gf = {};
    teams.forEach(function(t) { pts[t] = 0; gd[t] = 0; gf[t] = 0; });

    for (var i = 0; i < teams.length; i++) {
      for (var j = i + 1; j < teams.length; j++) {
        var h = teams[i], a = teams[j];
        var known = getKnownResult(h, a);
        var hs, as_;
        if (known) {
          hs = known.hg; as_ = known.ag;
        } else {
          var p = calcWinProb(h, a, false);
          var r = Math.random() * 100;
          if (r < p.home) { hs = Math.floor(Math.random()*3)+1; as_ = Math.max(0, hs-Math.floor(Math.random()*2)-1); }
          else if (r < p.home + p.draw) { hs = Math.floor(Math.random()*3); as_ = hs; }
          else { as_ = Math.floor(Math.random()*3)+1; hs = Math.max(0, as_-Math.floor(Math.random()*2)-1); }
        }
        pts[h] += hs > as_ ? 3 : hs === as_ ? 1 : 0;
        pts[a] += as_ > hs ? 3 : hs === as_ ? 1 : 0;
        gd[h] += hs - as_; gf[h] += hs;
        gd[a] += as_ - hs; gf[a] += as_;
      }
    }

    var sorted = teams.slice().sort(function(x, y) {
      if (pts[y] !== pts[x]) return pts[y] - pts[x];
      if (gd[y] !== gd[x]) return gd[y] - gd[x];
      return gf[y] - gf[x];
    });

    // grp 예: "그룹A" → "A"
    var letter = grp.replace('그룹','');
    groupResult[letter] = { first: sorted[0], second: sorted[1] };
    allThirds.push({ team: sorted[2], pts: pts[sorted[2]], gd: gd[sorted[2]], gf: gf[sorted[2]] });
  });

  // 최고 8개 3위팀 (조 성적 기준)
  allThirds.sort(function(a, b) {
    if (b.pts !== a.pts) return b.pts - a.pts;
    if (b.gd !== a.gd) return b.gd - a.gd;
    return b.gf - a.gf;
  });
  var thirds = allThirds.slice(0, 8).map(function(x){ return x.team; });

  return { groupResult: groupResult, thirds: thirds };
}

// ─── 실제 32강 대진표 (id 73~88 기준, index 0~15) ─────────
// 'X1'/'X2' = X조 1위/2위, '3rd' = 3위팀 슬롯 (8개)
var R32_STRUCTURE = [
  ['A2','B2'], ['E1','3rd'], ['F1','C2'], ['C1','F2'],
  ['I1','3rd'], ['E2','I2'], ['A1','3rd'], ['L1','3rd'],
  ['D1','3rd'], ['G1','3rd'], ['K2','L2'], ['H1','J2'],
  ['B1','3rd'], ['J1','H2'], ['K1','3rd'], ['D2','G2'],
];
// R32 결과(0~15) → R16 매치(0~7)
var R16_PAIRING = [[1,4],[0,2],[3,5],[6,7],[10,11],[8,9],[13,15],[12,14]];
// R16 결과(0~7) → 8강(0~3)
var QF_PAIRING  = [[0,1],[4,5],[2,3],[6,7]];
// 8강 결과(0~3) → 4강(0~1)
var SF_PAIRING  = [[0,1],[2,3]];

function simKnockout(groupResult, thirds) {
  // 3위팀 8명을 종합점수 순으로 '3rd' 슬롯에 배정 (고정 순서)
  var thirdsSorted = thirds.slice().sort(function(a,b){ return compositeScore(b) - compositeScore(a); });
  var thirdIdx = 0;

  function resolveSlot(slot) {
    if (slot === '3rd') return thirdsSorted[thirdIdx++];
    var grp = slot[0], pos = slot[1];
    return pos === '1' ? groupResult[grp].first : groupResult[grp].second;
  }

  // 32강
  var r32Winners = R32_STRUCTURE.map(function(pair) {
    var h = resolveSlot(pair[0]), a = resolveSlot(pair[1]);
    return simKOMatch(h, a);
  });

  // 16강
  var r16Winners = R16_PAIRING.map(function(p) {
    return simKOMatch(r32Winners[p[0]], r32Winners[p[1]]);
  });

  // 8강
  var qfWinners = QF_PAIRING.map(function(p) {
    return simKOMatch(r16Winners[p[0]], r16Winners[p[1]]);
  });

  // 4강
  var sfWinners = SF_PAIRING.map(function(p) {
    return simKOMatch(qfWinners[p[0]], qfWinners[p[1]]);
  });

  // 결승
  return simKOMatch(sfWinners[0], sfWinners[1]);
}

async function computeWinProbs() {
  if (winProbRunning) return;
  winProbRunning = true;

  var N = 10000, CHUNK = 500;
  var counts = {};
  var groupTeams = buildGroupTeamsForSim();
  var allTeams = [];
  Object.values(groupTeams).forEach(function(t) { allTeams = allTeams.concat(t); });

  for (var done = 0; done < N; done += CHUNK) {
    for (var i = 0; i < CHUNK && done + i < N; i++) {
      var result = simGroupStage(groupTeams);
      var winner = simKnockout(result.groupResult, result.thirds);
      counts[winner] = (counts[winner] || 0) + 1;
    }
    await new Promise(function(r) { setTimeout(r, 0); });
    // 중간 결과 렌더
    if (curFilter === 'WINPROB') renderWinProbTab(counts, done + CHUNK, N, allTeams);
  }

  winProbCache = { counts: counts, total: N, teams: allTeams };
  winProbRunning = false;
  if (curFilter === 'WINPROB') renderWinProbTab(counts, N, N, allTeams);
}

function renderWinProbTab(counts, done, total, allTeams) {
  var container = document.getElementById('list');
  if (!counts) {
    container.innerHTML = '<div style="text-align:center;color:#8b949e;padding:40px;font-size:13px">🔄 10,000회 시뮬레이션 실행 중...</div>';
    return;
  }

  var results = allTeams.map(function(t) {
    return { team: t, prob: (counts[t] || 0) / total * 100 };
  }).sort(function(a, b) { return b.prob - a.prob; });

  var maxProb = results[0].prob || 1;
  var progress = done < total ? '<div style="font-size:10px;color:#484f58;text-align:center;padding:4px">' + done + '/' + total + ' 시뮬레이션</div>' : '';

  var eloUpdated = processedEloMatches.size;
  var eloNote = eloUpdated > 0
    ? ' · <span style="color:#3fb950">Elo ' + eloUpdated + '경기 반영</span>'
    : '';
  var html = '<div style="padding:10px 14px 4px;display:flex;justify-content:space-between;align-items:center">' +
    '<span style="font-size:11px;color:#8b949e">🏆 우승 확률 · 순수 Elo · ' + total + '회 시뮬레이션' + eloNote + '</span>' +
    (done >= total ? '<span style="font-size:10px;color:#58a6ff;cursor:pointer" onclick="winProbCache=null;computeWinProbs();if(curFilter===\'WINPROB\')renderWinProbTab(null,0,10000,[])">🔄</span>' : '') +
  '</div>' + progress;

  results.forEach(function(item, idx) {
    var isKorea = (item.team === '한국');
    var barW = (item.prob / maxProb * 100).toFixed(1);
    var probColor = item.prob >= 10 ? '#d3aa3c' : item.prob >= 1 ? '#8b949e' : '#2e4a6a';
    var eloDiff = (currentElo[item.team] || ELO[item.team] || 1600) - (ELO[item.team] || 1600);
    var eloTag = eloDiff !== 0
      ? '<span style="font-size:9px;font-family:monospace;color:' + (eloDiff>0?'#3fb950':'#f85149') + '">' + (eloDiff>0?'+':'') + eloDiff + '</span>'
      : '';

    html += '<div style="display:flex;align-items:center;padding:7px 14px;border-bottom:1px solid #21262d;gap:8px;">' +
      '<div style="width:20px;text-align:right;font-size:11px;color:#484f58;font-family:monospace">' + (idx+1) + '</div>' +
      '<div style="width:85px;font-size:13px;font-weight:' + (isKorea?'bold':'normal') + ';color:' + (isKorea?'#58a6ff':'#e6edf3') + '">' +
        (isKorea ? '🇰🇷 ' : '') + item.team + ' ' + eloTag +
      '</div>' +
      '<div style="flex:1;background:#21262d;border-radius:3px;height:5px;overflow:hidden">' +
        '<div style="width:' + barW + '%;height:100%;background:' + (isKorea?'#58a6ff':probColor) + ';border-radius:3px;transition:width .3s"></div>' +
      '</div>' +
      '<div style="width:42px;text-align:right;font-size:12px;font-weight:bold;font-family:monospace;color:' + probColor + '">' +
        (item.prob >= 0.1 ? item.prob.toFixed(1) + '%' : '<0.1%') +
      '</div>' +
    '</div>';
  });

  container.innerHTML = html;
}

function toggleWinProb(btn) {
  var isActive = curFilter === 'WINPROB';
  if (isActive) {
    // 원래 전체 뷰로 복귀
    btn.style.background = 'rgba(211,170,60,.12)';
    btn.style.borderColor = 'rgba(211,170,60,.35)';
    btn.style.color = '#d3aa3c';
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
    document.querySelector('.chip').classList.add('active'); // 전체 chip
    curFilter = '';
    render();
  } else {
    btn.style.background = 'linear-gradient(135deg,#d3aa3c,#f0cc5a)';
    btn.style.borderColor = 'transparent';
    btn.style.color = '#07112b';
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
    curFilter = 'WINPROB';
    filterWinProb();
  }
}

function filterWinProb() {
  document.getElementById('list').scrollTop = 0;
  window.scrollTo(0, 0);
  var container = document.getElementById('list');
  if (winProbCache) {
    renderWinProbTab(winProbCache.counts, winProbCache.total, winProbCache.total, winProbCache.teams);
  } else {
    renderWinProbTab(null, 0, 10000, []);
    computeWinProbs();
  }
}

// ─── 스마트 새로고침 (탭 가시성 + 경기 상태 연동) ──────────
let refreshTimer = null;

function isAnyMatchLive() {
  const now = new Date();
  return M.some(function(m) {
    if (!m.away) return false;
    const dt = parseKST(m.d, m.t);
    const elapsed = (now - dt) / 60000;
    return elapsed > 0 && elapsed < 120 && (!m.score || (m.statusLabel && m.statusLabel !== 'FT'));
  });
}

function getRefreshInterval() {
  return isAnyMatchLive() ? 30000 : 6 * 60 * 1000;
}

function startRefreshTimer() {
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function() {
    fetchScores(false);
    startRefreshTimer();
  }, getRefreshInterval());
}

function stopRefreshTimer() {
  if (refreshTimer) { clearTimeout(refreshTimer); refreshTimer = null; }
}

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    stopRefreshTimer();
  } else {
    fetchScores(false);
    startRefreshTimer();
  }
});
render();
setInterval(tick, 1000);
tick();
fetchScores(false);
fetchRankings();
startRefreshTimer();
</script>
